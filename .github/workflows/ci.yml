name: CI

on:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - infra/cdk/**
      - .github/workflows/ci.yml
      - .github/workflows/infra-dev.yml
      - .github/workflows/app-deploy-dev.yml
  pull_request:
    branches:
      - main
    paths:
      - apps/web/**
      - infra/cdk/**
      - .github/workflows/ci.yml
      - .github/workflows/infra-dev.yml
      - .github/workflows/app-deploy-dev.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      WORKOPS_STAGE: dev
      GITHUB_REPOSITORY: ${{ github.repository }}
      CDK_DEFAULT_ACCOUNT: '000000000000'
      CDK_DEFAULT_REGION: ap-northeast-1
    steps:
      # Actions are pinned to public Git commit SHAs, not secrets.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Detect infra deploy changes
        id: changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            infra:
              - 'infra/cdk/**'
              - '.github/workflows/infra-dev.yml'

      - name: Save infra deploy change result
        run: |
          mkdir -p .p2-9-ci-changes
          echo "infra_changed=${{ steps.changes.outputs.infra }}" > .p2-9-ci-changes/changes.env

      - name: Upload infra deploy change result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p2-9-ci-changes
          path: .p2-9-ci-changes/changes.env
          if-no-files-found: error

      - name: Set up Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run web tests
        working-directory: apps/web
        run: ./mvnw test

      - name: Build web image
        working-directory: apps/web
        run: docker build -t workops-web:ci .

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Restore CDK dependencies
        working-directory: infra/cdk
        run: npm ci

      - name: Build CDK
        working-directory: infra/cdk
        run: npm run build

      - name: Test CDK
        working-directory: infra/cdk
        run: npm test -- --runInBand

      - name: Synthesize CDK
        working-directory: infra/cdk
        run: npm run cdk:deploy-app -- synth DeployStack
