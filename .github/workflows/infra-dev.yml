name: Infra Dev

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  read-changes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      infra_changed: ${{ steps.read.outputs.infra_changed }}
    steps:
      # Actions are pinned to public Git commit SHAs, not secrets.
      - name: Download CI change result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: p2-9-ci-changes
          path: .p2-9-ci-changes
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read CI change result
        id: read
        shell: bash
        run: |
          source .p2-9-ci-changes/changes.env
          echo "infra_changed=${infra_changed}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs:
      - read-changes
    if: needs.read-changes.outputs.infra_changed == 'true'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: workops-dev-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      WORKOPS_STAGE: dev
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      # Actions are pinned to public Git commit SHAs, not secrets.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - name: Restore CDK dependencies
        working-directory: infra/cdk
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity --region "$AWS_REGION"

      - name: Diff infra stacks
        working-directory: infra/cdk
        run: |
          npm run cdk -- diff FoundationStack
          npm run cdk -- diff SecretStack
          npm run cdk -- diff ConfigStack
          npm run cdk -- diff IdentityStack
          npm run cdk -- diff RegistryStack
          npm run cdk -- diff LogsStack

      - name: Deploy infra stacks
        working-directory: infra/cdk
        run: |
          npm run cdk -- deploy FoundationStack --require-approval never
          npm run cdk -- deploy SecretStack --require-approval never
          npm run cdk -- deploy ConfigStack --require-approval never
          npm run cdk -- deploy IdentityStack --require-approval never
          npm run cdk -- deploy RegistryStack --require-approval never
          npm run cdk -- deploy LogsStack --require-approval never
