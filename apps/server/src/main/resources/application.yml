spring:
  application:
    name: workops-server
  config:
    import: optional:file:../../.env.local[.properties]
  datasource:
    url: ${WORKOPS_DB_URL:jdbc:mysql://localhost:3306/workops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo}
    username: ${WORKOPS_DB_USERNAME:workops}
    password: ${WORKOPS_DB_PASSWORD:workops}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

---

spring:
  config:
    activate:
      on-profile: "!local"
  security:
    oauth2:
      client:
        registration:
          cognito:
            client-id: ${WORKOPS_COGNITO_CLIENT_ID:}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: ${WORKOPS_COGNITO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/cognito}
            scope:
              - openid
              - email
        provider:
          cognito:
            issuer-uri: ${WORKOPS_COGNITO_ISSUER_URI:}
