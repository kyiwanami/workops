<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Cognito Claims')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">M3 Cognito</p>
        <h1 class="h3 mb-2">Cognito Claims</h1>
        <p class="text-secondary mb-0">Spring Security が保持しているログイン済みユーザーのOIDC claimを確認します。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <div th:if="${authenticated}">
                <dl class="row mb-4">
                    <dt class="col-sm-3 text-secondary">Principal</dt>
                    <dd class="col-sm-9 mb-0" th:text="${principalName}">principal</dd>
                </dl>

                <div class="table-responsive">
                    <table class="table table-sm align-middle mb-0">
                        <thead>
                        <tr>
                            <th scope="col">Claim</th>
                            <th scope="col">Value</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="claim : ${claimRows}">
                            <td class="fw-semibold" th:text="${claim.name()}">claim</td>
                            <td th:text="${claim.value()}">value</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:unless="${authenticated}" class="text-secondary">
                認証済みユーザー情報はありません。Cognito確認時は local profile を外して起動してください。
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
