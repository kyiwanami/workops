<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('WorkOps')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">MVP Local</p>
        <h1 class="h3 mb-2">WorkOps</h1>
        <p class="text-secondary mb-0">申請管理と資産管理をローカル環境で実装していくための最小画面です。</p>
        <div class="mt-3">
            <a class="btn btn-outline-primary btn-sm" th:href="@{/auth/claims}">Cognito Claims</a>
        </div>
    </section>

    <section class="row g-3">
        <div class="col-12 col-lg-4">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5 card-title">Project Foundation</h2>
                    <p class="card-text text-secondary">Spring Boot / Thymeleaf / MyBatis / MySQL のMVP土台を積み上げます。</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5 card-title">Local Database</h2>
                    <p class="card-text text-secondary">Docker Compose MySQL と Flyway を使う前提で進めます。</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="card h-100">
                <div class="card-body">
                    <h2 class="h5 card-title">Screen Layer</h2>
                    <p class="card-text text-secondary">Bootstrap を使ったThymeleaf画面を業務機能ごとに追加します。</p>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
