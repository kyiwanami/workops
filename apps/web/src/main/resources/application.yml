spring:
  application:
    name: workops-web
  config:
    import: optional:file:../../.env.local[.properties]
  datasource:
    url: ${WORKOPS_DB_URL:jdbc:mysql://localhost:3306/workops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo}
    username: ${WORKOPS_DB_USERNAME:workops}
    password: ${WORKOPS_DB_PASSWORD:workops}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  tomcat:
    use-relative-redirects: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  # P2-3 uses Actuator only for ALB / ECS health checks.
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---

spring:
  config:
    activate:
      on-profile: "!local"
  security:
    oauth2:
      client:
        registration:
          platform:
            client-id: ${WORKOPS_COGNITO_PLATFORM_CLIENT_ID:}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: ${WORKOPS_COGNITO_PLATFORM_REDIRECT_URI:http://localhost:8080/login/oauth2/code/platform}
            scope:
              - openid
              - email
          tenant:
            client-id: ${WORKOPS_COGNITO_TENANT_CLIENT_ID:}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: ${WORKOPS_COGNITO_TENANT_REDIRECT_URI:http://localhost:8080/login/oauth2/code/tenant}
            scope:
              - openid
              - email
        provider:
          cognito:
            issuer-uri: https://cognito-idp.${AWS_REGION:ap-northeast-1}.amazonaws.com/${WORKOPS_COGNITO_USER_POOL_ID:}
