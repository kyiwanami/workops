<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Manager Authorization')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">M3 Authorization</p>
        <h1 class="h3 mb-2">Manager Only Page</h1>
        <p class="text-secondary mb-0">TENANT_MANAGER 権限セットを持つユーザーだけが表示できます。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <h2 class="h5 mb-3">Authorized User</h2>
            <div th:if="${loginUserContext != null}" class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <tbody>
                    <tr>
                        <th scope="row">userId</th>
                        <td th:text="${loginUserContext.userId()}">userId</td>
                    </tr>
                    <tr>
                        <th scope="row">username</th>
                        <td th:text="${loginUserContext.username()}">username</td>
                    </tr>
                    <tr>
                        <th scope="row">companyId</th>
                        <td th:text="${loginUserContext.companyId()}">companyId</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
