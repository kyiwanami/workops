<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('エラー | WorkOps')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Error</p>
        <h1 class="h3 mb-2">処理を完了できませんでした</h1>
        <p class="text-secondary mb-0">時間をおいて再度お試しください。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3 text-secondary">Status</dt>
                <dd class="col-sm-9" th:text="${status}">500</dd>
                <dt class="col-sm-3 text-secondary">Request ID</dt>
                <dd class="col-sm-9 font-monospace" th:text="${requestId}">-</dd>
            </dl>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
