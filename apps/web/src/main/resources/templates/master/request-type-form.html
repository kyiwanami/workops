<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('申請種別フォーム')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Master Management</p>
        <h1 class="h3 mb-2" th:text="${edit} ? '申請種別編集' : '申請種別登録'">申請種別登録</h1>
        <p class="text-secondary mb-0">所属会社内の申請種別を保存します。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <form method="post" th:action="${edit} ? @{/masters/request-types/{id}(id=${requestTypeId})} : @{/masters/request-types}" th:object="${requestTypeMasterForm}">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="code" class="form-label">申請種別コード</label>
                    <input id="code"
                           type="text"
                           class="form-control"
                           th:field="*{code}"
                           th:readonly="${edit}"
                           th:classappend="${#fields.hasErrors('code')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">
                        申請種別コードを入力してください。
                    </div>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">申請種別名</label>
                    <input id="name"
                           type="text"
                           class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        申請種別名を入力してください。
                    </div>
                </div>

                <div class="mb-4">
                    <label for="sortOrder" class="form-label">表示順</label>
                    <input id="sortOrder"
                           type="number"
                           class="form-control"
                           th:field="*{sortOrder}"
                           th:classappend="${#fields.hasErrors('sortOrder')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('sortOrder')}" th:errors="*{sortOrder}">
                        表示順を入力してください。
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="${edit} ? '更新' : '登録'">登録</button>
                    <a class="btn btn-outline-secondary" th:href="@{/masters/request-types}">キャンセル</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
