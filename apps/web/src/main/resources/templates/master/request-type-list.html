<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('申請種別一覧')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Master Management</p>
        <h1 class="h3 mb-2">申請種別一覧</h1>
        <p class="text-secondary mb-0">所属会社内の申請種別を管理します。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <div class="d-flex justify-content-end mb-3">
                <a class="btn btn-primary btn-sm" th:href="@{/masters/request-types/new}">新規作成</a>
            </div>

            <form class="border rounded p-3 mb-3 bg-body" method="get" th:action="@{/masters/request-types}" th:object="${requestTypeMasterSearchForm}">
                <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
                    <div class="form-check">
                        <input id="showDeleted"
                               type="checkbox"
                               class="form-check-input"
                               th:field="*{showDeleted}">
                        <label for="showDeleted" class="form-check-label">削除済みも表示</label>
                    </div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-secondary" th:href="@{/masters/request-types}">クリア</a>
                        <button type="submit" class="btn btn-primary">表示</button>
                    </div>
                </div>
            </form>

            <div th:if="${requestTypes.isEmpty()}" class="text-secondary">
                表示できる申請種別はありません。
            </div>

            <div th:unless="${requestTypes.isEmpty()}" class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col">コード</th>
                        <th scope="col">名称</th>
                        <th scope="col">表示順</th>
                        <th scope="col">状態</th>
                        <th scope="col">作成日時</th>
                        <th scope="col">更新日時</th>
                        <th scope="col">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="requestType : ${requestTypes}">
                        <td th:text="${requestType.code()}">PURCHASE</td>
                        <td th:text="${requestType.name()}">購入申請</td>
                        <td th:text="${requestType.sortOrder()}">10</td>
                        <td>
                            <span th:if="${requestType.isDeleted()}" class="badge text-bg-secondary">削除済み</span>
                            <span th:unless="${requestType.isDeleted()}" class="badge text-bg-success">有効</span>
                        </td>
                        <td th:text="${#temporals.format(requestType.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
                        <td th:text="${#temporals.format(requestType.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
                        <td>
                            <div class="d-flex gap-2">
                                <a th:unless="${requestType.isDeleted()}"
                                   class="btn btn-outline-primary btn-sm"
                                   th:href="@{/masters/request-types/{id}/edit(id=${requestType.id()})}">編集</a>
                                <button th:unless="${requestType.isDeleted()}"
                                        type="button"
                                        class="btn btn-outline-danger btn-sm"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="${'#deleteRequestTypeModal-' + requestType.id()}">削除</button>
                                <button th:if="${requestType.isDeleted()}"
                                        type="button"
                                        class="btn btn-outline-primary btn-sm"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="${'#restoreRequestTypeModal-' + requestType.id()}">復活</button>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <div th:each="requestType : ${requestTypes}"
         th:if="${requestType.isDeleted() == false}"
         class="modal fade"
         th:id="${'deleteRequestTypeModal-' + requestType.id()}"
         tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5">申請種別を削除します</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-2">この申請種別を削除してよろしいですか？</p>
                    <p class="mb-0 fw-semibold" th:text="${requestType.code() + ' / ' + requestType.name()}">EQUIPMENT_PURCHASE / 備品購入申請</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <form method="post" th:action="@{/masters/request-types/{id}/delete(id=${requestType.id()})}">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-danger">削除する</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:each="requestType : ${requestTypes}"
         th:if="${requestType.isDeleted() == true}"
         class="modal fade"
         th:id="${'restoreRequestTypeModal-' + requestType.id()}"
         tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5">申請種別を復活します</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-2">この申請種別を復活してよろしいですか？</p>
                    <p class="mb-0 fw-semibold" th:text="${requestType.code() + ' / ' + requestType.name()}">EQUIPMENT_PURCHASE / 備品購入申請</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <form method="post" th:action="@{/masters/request-types/{id}/restore(id=${requestType.id()})}">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-primary">復活する</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${message}" class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="request-type-list-toast" class="toast text-bg-success border-0" role="status" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" th:text="${message}">
                    申請種別を更新しました。
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:if="${message}">
    document.addEventListener('DOMContentLoaded', () => {
        const toastElement = document.getElementById('request-type-list-toast');
        if (toastElement) {
            bootstrap.Toast.getOrCreateInstance(toastElement).show();
        }
    });
</script>
</body>
</html>
