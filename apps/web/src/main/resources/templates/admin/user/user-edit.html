<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('ユーザー編集')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">User Management</p>
        <h1 class="h3 mb-2">ユーザー編集</h1>
        <p class="text-secondary mb-0" th:text="${user.username() + ' / ' + user.name()}">
            kthm-manager / 北浜 管理者
        </p>
    </section>

    <section class="card">
        <div class="card-body">
            <form method="post" th:action="${formAction}" th:object="${userEditForm}">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">入力内容を確認してください。</div>
                </div>

                <dl class="row mb-4">
                    <dt class="col-sm-3">ユーザー名</dt>
                    <dd class="col-sm-9" th:text="${user.username()}">kthm-manager</dd>

                    <dt class="col-sm-3">actor_type</dt>
                    <dd class="col-sm-9" th:text="${user.actorType()}">TENANT</dd>

                    <dt class="col-sm-3">会社</dt>
                    <dd class="col-sm-9" th:text="${user.companyName()}">北浜精密機器株式会社</dd>

                    <dt class="col-sm-3">cognito_sub</dt>
                    <dd class="col-sm-9 font-monospace" th:text="${user.cognitoSub()}">
                        00000000-0000-0000-0000-000000000003
                    </dd>
                </dl>

                <div class="mb-3">
                    <label for="name" class="form-label">表示名</label>
                    <input id="name"
                           type="text"
                           class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        表示名を入力してください。
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">email</label>
                    <input id="email"
                           type="email"
                           class="form-control"
                           th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                        emailを入力してください。
                    </div>
                </div>

                <div class="mb-3" th:if="${user.actorType() == 'TENANT'}">
                    <label for="departmentId" class="form-label">所属部署</label>
                    <select id="departmentId"
                            class="form-select"
                            th:field="*{departmentId}"
                            th:classappend="${#fields.hasErrors('departmentId')} ? ' is-invalid'">
                        <option value="">未設定</option>
                        <option th:each="department : ${departments}"
                                th:value="${department.id()}"
                                th:text="${department.name()}">
                            総務部
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}">
                        所属部署が見つかりません。
                    </div>
                </div>

                <div class="mb-4">
                    <fieldset th:classappend="${#fields.hasErrors('permissionSetCodes')} ? ' is-invalid'">
                        <legend class="form-label">権限セット</legend>
                        <div class="border rounded p-3">
                            <div class="form-check" th:each="permissionSet : ${permissionSets}">
                                <input class="form-check-input"
                                       type="checkbox"
                                       th:field="*{permissionSetCodes}"
                                       th:value="${permissionSet.code()}"
                                       th:id="${'permission-' + permissionSet.code()}">
                                <label class="form-check-label"
                                       th:for="${'permission-' + permissionSet.code()}"
                                       th:text="${permissionSet.code() + ' / ' + permissionSet.name()}">
                                    TENANT_MANAGER / 管理者
                                </label>
                            </div>
                        </div>
                    </fieldset>
                    <div class="text-danger small mt-1"
                         th:if="${#fields.hasErrors('permissionSetCodes')}"
                         th:errors="*{permissionSetCodes}">
                        権限セットを選択してください。
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">更新</button>
                    <a class="btn btn-outline-secondary" th:href="${cancelHref}">キャンセル</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
