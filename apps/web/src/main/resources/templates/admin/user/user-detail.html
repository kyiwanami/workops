<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('ユーザー詳細')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">User Management</p>
        <h1 class="h3 mb-2">ユーザー詳細</h1>
        <p class="text-secondary mb-0" th:text="${user.username() + ' / ' + user.name()}">
            kthm-manager / 北浜 管理者
        </p>
    </section>

    <section class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <a class="btn btn-outline-secondary btn-sm" th:href="${listHref}">一覧へ戻る</a>
            </div>

            <dl class="row mb-0">
                <dt class="col-sm-3">ユーザーID</dt>
                <dd class="col-sm-9" th:text="${user.id()}">3</dd>

                <dt class="col-sm-3">ユーザー名</dt>
                <dd class="col-sm-9" th:text="${user.username()}">kthm-manager</dd>

                <dt class="col-sm-3">表示名</dt>
                <dd class="col-sm-9" th:text="${user.name()}">北浜 管理者</dd>

                <dt class="col-sm-3">email</dt>
                <dd class="col-sm-9" th:text="${user.email()}">kthm-manager@example.local</dd>

                <dt class="col-sm-3">actor_type</dt>
                <dd class="col-sm-9" th:text="${user.actorType()}">TENANT</dd>

                <dt class="col-sm-3">会社</dt>
                <dd class="col-sm-9" th:text="${user.companyName()}">北浜精密機器株式会社</dd>

                <dt class="col-sm-3">所属部署</dt>
                <dd class="col-sm-9" th:text="${user.departmentName()}">総務部</dd>

                <dt class="col-sm-3">権限セット</dt>
                <dd class="col-sm-9" th:text="${user.permissionSetDisplay()}">TENANT_MANAGER / 管理者</dd>

                <dt class="col-sm-3">cognito_sub</dt>
                <dd class="col-sm-9 font-monospace" th:text="${user.cognitoSub()}">00000000-0000-0000-0000-000000000003</dd>

                <dt class="col-sm-3">状態</dt>
                <dd class="col-sm-9">
                    <span th:if="${user.isDeleted()}" class="badge text-bg-secondary">削除済み</span>
                    <span th:unless="${user.isDeleted()}" class="badge text-bg-success">有効</span>
                </dd>

                <dt class="col-sm-3">作成日時</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(user.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</dd>

                <dt class="col-sm-3">更新日時</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(user.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</dd>
            </dl>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
