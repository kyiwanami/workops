<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('ユーザー一覧')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">User Management</p>
        <h1 class="h3 mb-2">ユーザー一覧</h1>
        <p class="text-secondary mb-0" th:text="${platformAdmin} ? 'PLATFORM_ADMIN: 全ユーザー' : 'TENANT_MANAGER: 自社ユーザー'">
            PLATFORM_ADMIN: 全ユーザー
        </p>
    </section>

    <section class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">トップへ戻る</a>
            </div>

            <div th:if="${users.isEmpty()}" class="text-secondary">
                表示できるユーザーはありません。
            </div>

            <div th:unless="${users.isEmpty()}" class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col">ユーザー名</th>
                        <th scope="col">表示名</th>
                        <th scope="col">email</th>
                        <th scope="col">種別</th>
                        <th scope="col">会社</th>
                        <th scope="col">部署</th>
                        <th scope="col">権限セット</th>
                        <th scope="col">更新日時</th>
                        <th scope="col">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.username()}">kthm-manager</td>
                        <td th:text="${user.name()}">北浜 管理者</td>
                        <td th:text="${user.email()}">kthm-manager@example.local</td>
                        <td th:text="${user.actorType()}">TENANT</td>
                        <td th:text="${user.companyName()}">北浜精密機器株式会社</td>
                        <td th:text="${user.departmentName()}">総務部</td>
                        <td th:text="${user.permissionSetDisplay()}">TENANT_MANAGER / 管理者</td>
                        <td th:text="${#temporals.format(user.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
                        <td>
                            <a th:if="${platformAdmin}"
                               class="btn btn-outline-primary btn-sm"
                               th:href="@{/admin/users/{userId}(userId=${user.id()})}">詳細</a>
                            <a th:unless="${platformAdmin}"
                               class="btn btn-outline-primary btn-sm"
                               th:href="@{/users/{userId}(userId=${user.id()})}">詳細</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
