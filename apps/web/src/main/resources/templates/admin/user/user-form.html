<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('ユーザー登録')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">User Management</p>
        <h1 class="h3 mb-2">ユーザー登録</h1>
        <p class="text-secondary mb-0"
           th:text="${formMode == 'platform'} ? 'PLATFORMユーザーまたは任意会社のTENANTユーザーを作成します。' : '自社のTENANTユーザーを作成します。'">
            自社のTENANTユーザーを作成します。
        </p>
    </section>

    <section class="card">
        <div class="card-body">
            <form method="post" th:action="${formAction}" th:object="${userForm}">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input th:if="${formMode == 'tenant'}" type="hidden" th:field="*{actorType}" value="TENANT">

                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">入力内容を確認してください。</div>
                </div>

                <div class="mb-3" th:if="${formMode == 'platform'}">
                    <label for="actorType" class="form-label">actor_type</label>
                    <select id="actorType"
                            class="form-select"
                            th:field="*{actorType}"
                            th:classappend="${#fields.hasErrors('actorType')} ? ' is-invalid'">
                        <option value="PLATFORM">PLATFORM</option>
                        <option value="TENANT">TENANT</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('actorType')}" th:errors="*{actorType}">
                        actor_typeを選択してください。
                    </div>
                </div>

                <div class="mb-3" th:if="${formMode == 'platform'}">
                    <label for="companyId" class="form-label">会社</label>
                    <select id="companyId"
                            class="form-select"
                            th:field="*{companyId}"
                            th:classappend="${#fields.hasErrors('companyId')} ? ' is-invalid'">
                        <option value="">未選択</option>
                        <option th:each="company : ${companies}"
                                th:value="${company.id()}"
                                th:text="${company.code() + ' / ' + company.name()}">
                            KTHM_PRECISION / 北浜精密機器株式会社
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('companyId')}" th:errors="*{companyId}">
                        会社を選択してください。
                    </div>
                </div>

                <div class="mb-3">
                    <label for="departmentId" class="form-label">所属部署</label>
                    <select id="departmentId"
                            class="form-select"
                            th:field="*{departmentId}"
                            th:classappend="${#fields.hasErrors('departmentId')} ? ' is-invalid'">
                        <option value="">未設定</option>
                        <option th:each="department : ${departments}"
                                th:value="${department.id()}"
                                th:text="${formMode == 'platform' ? department.companyCode() + ' / ' + department.name() : department.name()}">
                            KTHM_PRECISION / 総務部
                        </option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}">
                        所属部署が見つかりません。
                    </div>
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">ユーザー名</label>
                    <input id="username"
                           type="text"
                           class="form-control"
                           th:field="*{username}"
                           th:classappend="${#fields.hasErrors('username')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">
                        ユーザー名を入力してください。
                    </div>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">表示名</label>
                    <input id="name"
                           type="text"
                           class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        表示名を入力してください。
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">email</label>
                    <input id="email"
                           type="email"
                           class="form-control"
                           th:field="*{email}"
                           th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                        emailを入力してください。
                    </div>
                </div>

                <div class="mb-4">
                    <fieldset>
                        <legend class="form-label">権限セット</legend>
                        <div class="row g-3">
                            <div class="col-12 col-lg-6" th:if="${formMode == 'platform'}">
                                <div class="border rounded p-3 h-100">
                                    <p class="fw-semibold mb-2">PLATFORM</p>
                                    <div class="form-check" th:each="permissionSet : ${platformPermissionSets}">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               th:field="*{permissionSetCodes}"
                                               th:value="${permissionSet.code()}"
                                               th:id="${'permission-' + permissionSet.code()}">
                                        <label class="form-check-label"
                                               th:for="${'permission-' + permissionSet.code()}"
                                               th:text="${permissionSet.code() + ' / ' + permissionSet.name()}">
                                            PLATFORM_ADMIN / WorkOps管理者
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div th:class="${formMode == 'platform'} ? 'col-12 col-lg-6' : 'col-12'">
                                <div class="border rounded p-3 h-100">
                                    <p class="fw-semibold mb-2">TENANT</p>
                                    <div class="form-check" th:each="permissionSet : ${tenantPermissionSets}">
                                        <input class="form-check-input"
                                               type="checkbox"
                                               th:field="*{permissionSetCodes}"
                                               th:value="${permissionSet.code()}"
                                               th:id="${'permission-' + permissionSet.code()}">
                                        <label class="form-check-label"
                                               th:for="${'permission-' + permissionSet.code()}"
                                               th:text="${permissionSet.code() + ' / ' + permissionSet.name()}">
                                            TENANT_MANAGER / 管理者
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </fieldset>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">登録</button>
                    <a class="btn btn-outline-secondary" th:href="${cancelHref}">キャンセル</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
