<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('会社編集')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Company Management</p>
        <h1 class="h3 mb-2">会社編集</h1>
        <p class="text-secondary mb-0" th:text="${company.code() + ' / ' + company.name()}">
            KTHM_PRECISION / 北浜精密機器株式会社
        </p>
    </section>

    <section class="card">
        <div class="card-body">
            <form method="post" th:action="${formAction}" th:object="${companyEditForm}">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <dl class="row mb-4">
                    <dt class="col-sm-3">会社ID</dt>
                    <dd class="col-sm-9" th:text="${company.id()}">1</dd>

                    <dt class="col-sm-3">会社コード</dt>
                    <dd class="col-sm-9" th:text="${company.code()}">KTHM_PRECISION</dd>

                    <dt class="col-sm-3">状態</dt>
                    <dd class="col-sm-9">
                        <span class="badge text-bg-success">有効</span>
                    </dd>
                </dl>

                <div class="mb-4">
                    <label for="name" class="form-label">会社名</label>
                    <input id="name"
                           type="text"
                           class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        会社名を入力してください。
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a class="btn btn-outline-secondary" th:href="${cancelHref}">キャンセル</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
