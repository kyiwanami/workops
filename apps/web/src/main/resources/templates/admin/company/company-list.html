<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('会社一覧')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Company Management</p>
        <h1 class="h3 mb-2">会社一覧</h1>
        <p class="text-secondary mb-0">PLATFORM_ADMIN: 会社管理</p>
    </section>

    <section class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">トップへ戻る</a>
                <a class="btn btn-primary btn-sm" th:href="@{/admin/companies/new}">新規作成</a>
            </div>

            <form class="border rounded p-3 mb-3 bg-body"
                  method="get"
                  th:action="@{/admin/companies}"
                  th:object="${companySearchForm}">
                <div class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
                    <div class="form-check">
                        <input id="showDeleted"
                               type="checkbox"
                               class="form-check-input"
                               th:field="*{showDeleted}">
                        <label for="showDeleted" class="form-check-label">削除済みも表示</label>
                    </div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-secondary" th:href="@{/admin/companies}">クリア</a>
                        <button type="submit" class="btn btn-primary">表示</button>
                    </div>
                </div>
            </form>

            <div th:if="${companies.isEmpty()}" class="text-secondary">
                表示できる会社はありません。
            </div>

            <div th:unless="${companies.isEmpty()}" class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">コード</th>
                        <th scope="col">名称</th>
                        <th scope="col">部署</th>
                        <th scope="col">ユーザー</th>
                        <th scope="col">申請</th>
                        <th scope="col">資産</th>
                        <th scope="col">状態</th>
                        <th scope="col">更新日時</th>
                        <th scope="col">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="company : ${companies}">
                        <td th:text="${company.id()}">1</td>
                        <td th:text="${company.code()}">KTHM_PRECISION</td>
                        <td th:text="${company.name()}">北浜精密機器株式会社</td>
                        <td th:text="${company.departmentCount()}">4</td>
                        <td th:text="${company.userCount()}">3</td>
                        <td th:text="${company.requestCount()}">2</td>
                        <td th:text="${company.assetCount()}">3</td>
                        <td>
                            <span th:if="${company.isDeleted()}" class="badge text-bg-secondary">削除済み</span>
                            <span th:unless="${company.isDeleted()}" class="badge text-bg-success">有効</span>
                        </td>
                        <td th:text="${#temporals.format(company.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
                        <td>
                            <a class="btn btn-outline-primary btn-sm"
                               th:href="@{/admin/companies/{companyId}(companyId=${company.id()})}">詳細</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <div th:if="${message}" class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="company-list-toast" class="toast text-bg-success border-0" role="status" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" th:text="${message}">
                    会社を登録しました。
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:if="${message}">
    document.addEventListener('DOMContentLoaded', () => {
        const toastElement = document.getElementById('company-list-toast');
        if (toastElement) {
            bootstrap.Toast.getOrCreateInstance(toastElement).show();
        }
    });
</script>
</body>
</html>
