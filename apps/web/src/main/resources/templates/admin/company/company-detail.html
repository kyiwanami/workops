<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('会社詳細')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Company Management</p>
        <h1 class="h3 mb-2">会社詳細</h1>
        <p class="text-secondary mb-0" th:text="${company.code() + ' / ' + company.name()}">
            KTHM_PRECISION / 北浜精密機器株式会社
        </p>
    </section>

    <section class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/companies}">一覧へ戻る</a>
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-primary btn-sm"
                       th:href="@{/admin/companies/{companyId}/departments(companyId=${company.id()})}">部署一覧</a>
                    <a th:unless="${company.isDeleted()}"
                       class="btn btn-primary btn-sm"
                       th:href="@{/admin/companies/{companyId}/edit(companyId=${company.id()})}">編集</a>
                    <button th:unless="${company.isDeleted()}"
                            type="button"
                            class="btn btn-outline-danger btn-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#deleteCompanyModal">削除</button>
                </div>
            </div>

            <dl class="row mb-0">
                <dt class="col-sm-3">会社ID</dt>
                <dd class="col-sm-9" th:text="${company.id()}">1</dd>

                <dt class="col-sm-3">会社コード</dt>
                <dd class="col-sm-9" th:text="${company.code()}">KTHM_PRECISION</dd>

                <dt class="col-sm-3">会社名</dt>
                <dd class="col-sm-9" th:text="${company.name()}">北浜精密機器株式会社</dd>

                <dt class="col-sm-3">状態</dt>
                <dd class="col-sm-9">
                    <span th:if="${company.isDeleted()}" class="badge text-bg-secondary">削除済み</span>
                    <span th:unless="${company.isDeleted()}" class="badge text-bg-success">有効</span>
                </dd>

                <dt class="col-sm-3">部署数</dt>
                <dd class="col-sm-9" th:text="${company.departmentCount()}">4</dd>

                <dt class="col-sm-3">ユーザー数</dt>
                <dd class="col-sm-9" th:text="${company.userCount()}">3</dd>

                <dt class="col-sm-3">申請数</dt>
                <dd class="col-sm-9" th:text="${company.requestCount()}">2</dd>

                <dt class="col-sm-3">資産数</dt>
                <dd class="col-sm-9" th:text="${company.assetCount()}">3</dd>

                <dt class="col-sm-3">会社別マスタ値数</dt>
                <dd class="col-sm-9" th:text="${company.genericMasterValueCount()}">9</dd>

                <dt class="col-sm-3">作成日時</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(company.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</dd>

                <dt class="col-sm-3">更新日時</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(company.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</dd>
            </dl>
        </div>
    </section>

    <div th:unless="${company.isDeleted()}" class="modal fade" id="deleteCompanyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5">会社を削除します</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-2">この会社を削除してよろしいですか？</p>
                    <p class="mb-2 fw-semibold" th:text="${company.code() + ' / ' + company.name()}">
                        KTHM_PRECISION / 北浜精密機器株式会社
                    </p>
                    <p class="text-danger mb-0"
                       th:text="${'配下データ: 部署 ' + company.departmentCount() + ' 件、ユーザー ' + company.userCount() + ' 件、申請 ' + company.requestCount() + ' 件、資産 ' + company.assetCount() + ' 件、会社別マスタ値 ' + company.genericMasterValueCount() + ' 件。配下データは削除されません。'}">
                        配下データは削除されません。
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">キャンセル</button>
                    <form method="post"
                          th:action="@{/admin/companies/{companyId}/delete(companyId=${company.id()})}">
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-danger">削除する</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${message}" class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="company-detail-toast" class="toast text-bg-success border-0" role="status" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" th:text="${message}">
                    会社を更新しました。
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:if="${message}">
    document.addEventListener('DOMContentLoaded', () => {
        const toastElement = document.getElementById('company-detail-toast');
        if (toastElement) {
            bootstrap.Toast.getOrCreateInstance(toastElement).show();
        }
    });
</script>
</body>
</html>
