<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('会社登録')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Platform Administration</p>
        <h1 class="h3 mb-2">会社登録</h1>
        <p class="text-secondary mb-0">会社を作成し、申請種別と資産分類の初期値を投入します。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <form method="post" th:action="@{/admin/companies}" th:object="${companyForm}">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="code" class="form-label">会社コード</label>
                    <input id="code"
                           type="text"
                           class="form-control"
                           th:field="*{code}"
                           th:classappend="${#fields.hasErrors('code')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">
                        会社コードを入力してください。
                    </div>
                </div>

                <div class="mb-4">
                    <label for="name" class="form-label">会社名</label>
                    <input id="name"
                           type="text"
                           class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        会社名を入力してください。
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">登録</button>
                    <a class="btn btn-outline-secondary" th:href="@{/}">キャンセル</a>
                </div>
            </form>
        </div>
    </section>

    <div th:if="${message}" class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="company-create-toast" class="toast text-bg-success border-0" role="status" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" th:text="${message}">
                    会社を登録しました。
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script>
    (() => {
        const toastElement = document.getElementById('company-create-toast');
        if (toastElement) {
            bootstrap.Toast.getOrCreateInstance(toastElement).show();
        }
    })();
</script>
</body>
</html>
