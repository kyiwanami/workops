<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${edit} ? '部署編集' : '部署登録')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Department Management</p>
        <h1 class="h3 mb-2" th:text="${edit} ? '部署編集' : '部署登録'">部署登録</h1>
        <p class="text-secondary mb-0" th:text="${departmentListPage.companyCode() + ' / ' + departmentListPage.companyName()}">
            KTHM_PRECISION / 北浜精密機器株式会社
        </p>
    </section>

    <section class="card">
        <div class="card-body">
            <form method="post"
                  th:action="${formAction}"
                  th:object="${departmentForm}">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="code" class="form-label">部署コード</label>
                    <input id="code"
                           type="text"
                           class="form-control"
                           th:field="*{code}"
                           th:readonly="${edit}"
                           th:classappend="${#fields.hasErrors('code')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">
                        部署コードを入力してください。
                    </div>
                </div>

                <div class="mb-4">
                    <label for="name" class="form-label">部署名</label>
                    <input id="name"
                           type="text"
                           class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        部署名を入力してください。
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="${edit} ? '保存' : '登録'">登録</button>
                    <a class="btn btn-outline-secondary" th:href="${cancelHref}">キャンセル</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
