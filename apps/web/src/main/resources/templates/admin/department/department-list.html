<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('部署一覧')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Department Management</p>
        <h1 class="h3 mb-2">部署一覧</h1>
        <p class="text-secondary mb-0" th:text="${departmentListPage.companyCode() + ' / ' + departmentListPage.companyName()}">
            KTHM_PRECISION / 北浜精密機器株式会社
        </p>
    </section>

    <section class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">トップへ戻る</a>
                <a th:if="${platformAdmin}"
                   class="btn btn-primary btn-sm"
                   th:href="@{/admin/companies/{companyId}/departments/new(companyId=${departmentListPage.companyId()})}">新規作成</a>
                <a th:unless="${platformAdmin}"
                   class="btn btn-primary btn-sm"
                   th:href="@{/departments/new}">新規作成</a>
            </div>

            <div th:if="${departmentListPage.departments().isEmpty()}" class="text-secondary">
                表示できる部署はありません。
            </div>

            <div th:unless="${departmentListPage.departments().isEmpty()}" class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col">コード</th>
                        <th scope="col">名称</th>
                        <th scope="col">作成日時</th>
                        <th scope="col">更新日時</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="department : ${departmentListPage.departments()}">
                        <td th:text="${department.code()}">ADMIN</td>
                        <td th:text="${department.name()}">総務部</td>
                        <td th:text="${#temporals.format(department.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
                        <td th:text="${#temporals.format(department.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <div th:if="${message}" class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="department-list-toast" class="toast text-bg-success border-0" role="status" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" th:text="${message}">
                    部署を登録しました。
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:if="${message}">
    document.addEventListener('DOMContentLoaded', () => {
        const toastElement = document.getElementById('department-list-toast');
        if (toastElement) {
            bootstrap.Toast.getOrCreateInstance(toastElement).show();
        }
    });
</script>
</body>
</html>
