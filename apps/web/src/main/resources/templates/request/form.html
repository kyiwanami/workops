<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('申請フォーム')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Request Management</p>
        <h1 class="h3 mb-2" th:text="${edit} ? '申請編集' : '申請作成'">申請作成</h1>
        <p class="text-secondary mb-0">申請を下書きとして保存します。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <form method="post" th:action="${edit} ? @{/requests/{id}(id=${requestId})} : @{/requests}" th:object="${requestForm}">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="processTypeCode" class="form-label">処理タイプ</label>
                    <select id="processTypeCode"
                            class="form-select"
                            th:field="*{processTypeCode}"
                            th:classappend="${#fields.hasErrors('processTypeCode')} ? ' is-invalid'">
                        <option value="">選択してください</option>
                        <option th:each="option : ${processTypeOptions}"
                                th:value="${option.code()}"
                                th:text="${option.name()}">購入</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('processTypeCode')}" th:errors="*{processTypeCode}">
                        処理タイプを選択してください。
                    </div>
                </div>

                <div class="mb-3">
                    <label for="title" class="form-label">件名</label>
                    <input id="title"
                           type="text"
                           class="form-control"
                           th:field="*{title}"
                           th:classappend="${#fields.hasErrors('title')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                        件名を入力してください。
                    </div>
                </div>

                <div class="mb-4">
                    <label for="content" class="form-label">申請内容</label>
                    <textarea id="content"
                              class="form-control"
                              rows="8"
                              th:field="*{content}"
                              th:classappend="${#fields.hasErrors('content')} ? ' is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">
                        申請内容は2000文字以内で入力してください。
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">下書き保存</button>
                    <a class="btn btn-outline-secondary"
                       th:href="${edit} ? @{/requests/{id}(id=${requestId})} : @{/requests}">キャンセル</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
