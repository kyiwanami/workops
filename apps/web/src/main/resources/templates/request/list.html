<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('申請一覧')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Request Management</p>
        <h1 class="h3 mb-2">申請一覧</h1>
        <p class="text-secondary mb-0">所属会社内の申請を表示します。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <div class="d-flex justify-content-end mb-3">
                <a th:if="${canCreate}" class="btn btn-primary btn-sm" th:href="@{/requests/new}">新規作成</a>
            </div>

            <div th:if="${requests.isEmpty()}" class="text-secondary">
                表示できる申請はありません。
            </div>

            <div th:unless="${requests.isEmpty()}" class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col">件名</th>
                        <th scope="col">申請者</th>
                        <th scope="col">関連資産</th>
                        <th scope="col">処理タイプ</th>
                        <th scope="col">ステータス</th>
                        <th scope="col">提出日時</th>
                        <th scope="col">作成日時</th>
                        <th scope="col">更新日時</th>
                        <th scope="col">詳細</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="request : ${requests}">
                        <td th:text="${request.title()}">件名</td>
                        <td th:text="${request.requesterName()}">申請者</td>
                        <td th:text="${request.assetCode() != null ? request.assetCode() + ' / ' + request.assetName() + (request.assetDeleted() == true ? '（削除済み）' : '') : '-'}">-</td>
                        <td>
                            <span th:text="${request.processTypeName()}">購入</span>
                            <span class="text-secondary d-block small" th:text="${request.processTypeCode()}">PURCHASE</span>
                        </td>
                        <td>
                            <span th:text="${request.statusName()}">下書き</span>
                            <span class="text-secondary d-block small" th:text="${request.statusCode()}">DRAFT</span>
                        </td>
                        <td th:text="${request.submittedAt() != null ? #temporals.format(request.submittedAt(), 'yyyy-MM-dd HH:mm') : '-'}">-</td>
                        <td th:text="${#temporals.format(request.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
                        <td th:text="${#temporals.format(request.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
                        <td>
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/requests/{id}(id=${request.id()})}">詳細</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
