<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('申請詳細')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Request Management</p>
        <h1 class="h3 mb-2" th:text="${request.title()}">申請詳細</h1>
        <p class="text-secondary mb-0">申請の現在状態を表示します。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
                <div>
                    <span class="badge text-bg-secondary" th:text="${request.statusName()}">ステータス</span>
                    <span class="badge text-bg-light border ms-2" th:text="${request.processTypeName()}">処理タイプ</span>
                </div>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/requests}">一覧へ戻る</a>
            </div>

            <dl class="row mb-0">
                <dt class="col-sm-3 text-secondary">申請ID</dt>
                <dd class="col-sm-9" th:text="${request.id()}">1</dd>

                <dt class="col-sm-3 text-secondary">申請者</dt>
                <dd class="col-sm-9" th:text="${request.requesterName()}">申請者</dd>

                <dt class="col-sm-3 text-secondary">処理タイプ</dt>
                <dd class="col-sm-9">
                    <span th:text="${request.processTypeName()}">購入</span>
                    <span class="text-secondary" th:text="'(' + ${request.processTypeCode()} + ')'">(PURCHASE)</span>
                </dd>

                <dt class="col-sm-3 text-secondary">ステータス</dt>
                <dd class="col-sm-9">
                    <span th:text="${request.statusName()}">下書き</span>
                    <span class="text-secondary" th:text="'(' + ${request.statusCode()} + ')'">(DRAFT)</span>
                </dd>

                <dt class="col-sm-3 text-secondary">関連資産ID</dt>
                <dd class="col-sm-9" th:text="${request.assetId() != null ? request.assetId() : '-'}">-</dd>

                <dt class="col-sm-3 text-secondary">申請内容</dt>
                <dd class="col-sm-9" th:text="${request.content() != null && request.content() != '' ? request.content() : '-'}">申請内容</dd>

                <dt class="col-sm-3 text-secondary">承認・却下・差戻しコメント</dt>
                <dd class="col-sm-9" th:text="${request.reviewComment() != null && request.reviewComment() != '' ? request.reviewComment() : '-'}">-</dd>

                <dt class="col-sm-3 text-secondary">提出日時</dt>
                <dd class="col-sm-9" th:text="${request.submittedAt() != null ? #temporals.format(request.submittedAt(), 'yyyy-MM-dd HH:mm') : '-'}">-</dd>

                <dt class="col-sm-3 text-secondary">作成日時</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(request.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</dd>

                <dt class="col-sm-3 text-secondary">更新日時</dt>
                <dd class="col-sm-9 mb-0" th:text="${#temporals.format(request.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</dd>
            </dl>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
