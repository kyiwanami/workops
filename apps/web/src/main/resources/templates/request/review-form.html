<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('申請レビュー')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Request Management</p>
        <h1 class="h3 mb-2" th:text="${pageTitle}">申請却下</h1>
        <p class="text-secondary mb-0" th:text="${request.title()}">申請タイトル</p>
    </section>

    <section class="card">
        <div class="card-body">
            <dl class="row mb-4">
                <dt class="col-sm-3 text-secondary">申請ID</dt>
                <dd class="col-sm-9" th:text="${request.id()}">1</dd>

                <dt class="col-sm-3 text-secondary">申請者</dt>
                <dd class="col-sm-9" th:text="${request.requesterName()}">申請者</dd>

                <dt class="col-sm-3 text-secondary">処理タイプ</dt>
                <dd class="col-sm-9" th:text="${request.processTypeName()}">購入</dd>
            </dl>

            <form method="post"
                  th:action="${reviewAction == 'reject'} ? @{/requests/{id}/reject(id=${request.id()})} : @{/requests/{id}/remand(id=${request.id()})}"
                  th:object="${requestReviewForm}">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-4">
                    <label for="reviewComment" class="form-label" th:text="${commentLabel}">理由</label>
                    <textarea id="reviewComment"
                              class="form-control"
                              rows="6"
                              th:field="*{reviewComment}"
                              th:classappend="${#fields.hasErrors('reviewComment')} ? ' is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('reviewComment')}" th:errors="*{reviewComment}">
                        理由を入力してください。
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="${submitLabel}">却下</button>
                    <a class="btn btn-outline-secondary" th:href="@{/requests/{id}(id=${request.id()})}">キャンセル</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
