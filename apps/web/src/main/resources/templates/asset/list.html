<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('資産一覧')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Asset Management</p>
        <h1 class="h3 mb-2">資産一覧</h1>
        <p class="text-secondary mb-0">所属会社内の未削除資産を表示します。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <div class="d-flex justify-content-end mb-3">
                <a th:if="${canCreate}" class="btn btn-primary btn-sm" th:href="@{/assets/new}">新規作成</a>
            </div>

            <form class="border rounded p-3 mb-3 bg-body" method="get" th:action="@{/assets}" th:object="${assetSearchForm}">
                <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-3">
                        <label for="assetCode" class="form-label">資産コード</label>
                        <input id="assetCode"
                               type="text"
                               class="form-control"
                               th:field="*{assetCode}">
                    </div>
                    <div class="col-12 col-md-3">
                        <label for="assetName" class="form-label">資産名</label>
                        <input id="assetName"
                               type="text"
                               class="form-control"
                               th:field="*{assetName}">
                    </div>
                    <div class="col-12 col-md-2">
                        <label for="assetCategoryValueId" class="form-label">カテゴリ</label>
                        <select id="assetCategoryValueId" class="form-select" th:field="*{assetCategoryValueId}">
                            <option value="">すべて</option>
                            <option th:each="option : ${assetCategoryOptions}"
                                    th:value="${option.id()}"
                                    th:text="${option.name()}">ノートPC</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-2">
                        <label for="departmentId" class="form-label">管理部署</label>
                        <select id="departmentId" class="form-select" th:field="*{departmentId}">
                            <option value="">すべて</option>
                            <option th:each="option : ${departmentOptions}"
                                    th:value="${option.id()}"
                                    th:text="${option.name()}">情報システム部</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-2">
                        <label for="statusCode" class="form-label">ステータス</label>
                        <select id="statusCode" class="form-select" th:field="*{statusCode}">
                            <option value="">すべて</option>
                            <option th:each="option : ${statusOptions}"
                                    th:value="${option.code()}"
                                    th:text="${option.name()}">利用可能</option>
                        </select>
                    </div>
                    <div class="col-12 d-flex justify-content-end gap-2">
                        <a class="btn btn-outline-secondary" th:href="@{/assets}">クリア</a>
                        <button type="submit" class="btn btn-primary">検索</button>
                    </div>
                </div>
            </form>

            <div th:if="${assets.isEmpty()}" class="text-secondary">
                表示できる資産はありません。
            </div>

            <div th:unless="${assets.isEmpty()}" class="table-responsive">
                <table class="table table-sm align-middle mb-0">
                    <thead>
                    <tr>
                        <th scope="col">資産コード</th>
                        <th scope="col">資産名</th>
                        <th scope="col">カテゴリ</th>
                        <th scope="col">管理部署</th>
                        <th scope="col">ステータス</th>
                        <th scope="col">作成日時</th>
                        <th scope="col">更新日時</th>
                        <th scope="col">詳細</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="asset : ${assets}">
                        <td th:text="${asset.code()}">KTHM-NB-001</td>
                        <td th:text="${asset.name()}">営業部ノートPC</td>
                        <td>
                            <span th:text="${asset.assetCategoryName()}">ノートPC</span>
                            <span class="text-secondary d-block small" th:text="${asset.assetCategoryCode()}">NOTE_PC</span>
                        </td>
                        <td th:text="${asset.departmentName() != null ? asset.departmentName() : '-'}">情報システム部</td>
                        <td>
                            <span th:text="${asset.statusName()}">利用可能</span>
                            <span class="text-secondary d-block small" th:text="${asset.statusCode()}">AVAILABLE</span>
                        </td>
                        <td th:text="${#temporals.format(asset.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
                        <td th:text="${#temporals.format(asset.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</td>
                        <td>
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/assets/{id}(id=${asset.id()})}">詳細</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
