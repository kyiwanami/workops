<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('資産フォーム')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Asset Management</p>
        <h1 class="h3 mb-2" th:text="${edit} ? '資産編集' : '資産登録'">資産登録</h1>
        <p class="text-secondary mb-0">所属会社内の資産情報を保存します。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <form method="post" th:action="${edit} ? @{/assets/{id}(id=${assetId})} : @{/assets}" th:object="${assetForm}">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="code" class="form-label">資産コード</label>
                    <input id="code"
                           type="text"
                           class="form-control"
                           th:field="*{code}"
                           th:classappend="${#fields.hasErrors('code')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">
                        資産コードを入力してください。
                    </div>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label">資産名</label>
                    <input id="name"
                           type="text"
                           class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        資産名を入力してください。
                    </div>
                </div>

                <div class="mb-3">
                    <label for="assetCategoryValueId" class="form-label">資産カテゴリ</label>
                    <select id="assetCategoryValueId"
                            class="form-select"
                            th:field="*{assetCategoryValueId}"
                            th:classappend="${#fields.hasErrors('assetCategoryValueId')} ? ' is-invalid'">
                        <option value="">選択してください</option>
                        <option th:each="option : ${assetCategoryOptions}"
                                th:value="${option.id()}"
                                th:text="${option.name()}">ノートPC</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('assetCategoryValueId')}" th:errors="*{assetCategoryValueId}">
                        資産カテゴリを選択してください。
                    </div>
                </div>

                <div class="mb-3">
                    <label for="departmentId" class="form-label">管理部署</label>
                    <select id="departmentId"
                            class="form-select"
                            th:field="*{departmentId}"
                            th:classappend="${#fields.hasErrors('departmentId')} ? ' is-invalid'">
                        <option value="">未選択</option>
                        <option th:each="option : ${departmentOptions}"
                                th:value="${option.id()}"
                                th:text="${option.name()}">情報システム部</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}">
                        管理部署が不正です。
                    </div>
                </div>

                <div class="mb-3">
                    <label for="statusCode" class="form-label">資産ステータス</label>
                    <select id="statusCode"
                            class="form-select"
                            th:field="*{statusCode}"
                            th:classappend="${#fields.hasErrors('statusCode')} ? ' is-invalid'">
                        <option value="">選択してください</option>
                        <option th:each="option : ${statusOptions}"
                                th:value="${option.code()}"
                                th:text="${option.name()}">利用可能</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('statusCode')}" th:errors="*{statusCode}">
                        資産ステータスを選択してください。
                    </div>
                </div>

                <div class="mb-4">
                    <label for="note" class="form-label">備考</label>
                    <textarea id="note"
                              class="form-control"
                              rows="6"
                              th:field="*{note}"
                              th:classappend="${#fields.hasErrors('note')} ? ' is-invalid'"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('note')}" th:errors="*{note}">
                        備考は1000文字以内で入力してください。
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary" th:text="${edit} ? '更新' : '登録'">登録</button>
                    <a class="btn btn-outline-secondary"
                       th:href="${edit} ? @{/assets/{id}(id=${assetId})} : @{/assets}">キャンセル</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
