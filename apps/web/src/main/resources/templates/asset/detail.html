<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('資産詳細')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Asset Management</p>
        <h1 class="h3 mb-2" th:text="${asset.name()}">資産詳細</h1>
        <p class="text-secondary mb-0">資産の現在状態を表示します。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
                <div>
                    <span class="badge text-bg-secondary" th:text="${asset.statusName()}">ステータス</span>
                    <span class="badge text-bg-light border ms-2" th:text="${asset.assetCategoryName()}">カテゴリ</span>
                </div>
                <div class="d-flex gap-2">
                    <a th:if="${canEdit}" class="btn btn-primary btn-sm" th:href="@{/assets/{id}/edit(id=${asset.id()})}">編集</a>
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{/assets}">一覧へ戻る</a>
                </div>
            </div>

            <dl class="row mb-0">
                <dt class="col-sm-3 text-secondary">資産ID</dt>
                <dd class="col-sm-9" th:text="${asset.id()}">1</dd>

                <dt class="col-sm-3 text-secondary">資産コード</dt>
                <dd class="col-sm-9" th:text="${asset.code()}">KTHM-NB-001</dd>

                <dt class="col-sm-3 text-secondary">資産名</dt>
                <dd class="col-sm-9" th:text="${asset.name()}">営業部ノートPC</dd>

                <dt class="col-sm-3 text-secondary">カテゴリ</dt>
                <dd class="col-sm-9">
                    <span th:text="${asset.assetCategoryName()}">ノートPC</span>
                    <span class="text-secondary" th:text="'(' + ${asset.assetCategoryCode()} + ')'">(NOTE_PC)</span>
                </dd>

                <dt class="col-sm-3 text-secondary">管理部署</dt>
                <dd class="col-sm-9" th:text="${asset.departmentName() != null ? asset.departmentName() : '-'}">情報システム部</dd>

                <dt class="col-sm-3 text-secondary">ステータス</dt>
                <dd class="col-sm-9">
                    <span th:text="${asset.statusName()}">利用可能</span>
                    <span class="text-secondary" th:text="'(' + ${asset.statusCode()} + ')'">(AVAILABLE)</span>
                </dd>

                <dt class="col-sm-3 text-secondary">備考</dt>
                <dd class="col-sm-9" th:text="${asset.note() != null && asset.note() != '' ? asset.note() : '-'}">備考</dd>

                <dt class="col-sm-3 text-secondary">作成日時</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(asset.createdAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</dd>

                <dt class="col-sm-3 text-secondary">更新日時</dt>
                <dd class="col-sm-9 mb-0" th:text="${#temporals.format(asset.updatedAt(), 'yyyy-MM-dd HH:mm')}">2026-01-01 09:00</dd>
            </dl>
        </div>
    </section>

    <div th:if="${message}" class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="asset-save-toast" class="toast text-bg-success border-0" role="status" data-bs-delay="4000">
            <div class="d-flex">
                <div class="toast-body" th:text="${message}">
                    資産を保存しました。
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:if="${message}">
    document.addEventListener('DOMContentLoaded', () => {
        const toastElement = document.getElementById('asset-save-toast');
        if (toastElement) {
            bootstrap.Toast.getOrCreateInstance(toastElement).show();
        }
    });
</script>
</body>
</html>
