<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('資産ステータス変更')}"></head>
<body class="bg-body-tertiary">
<header th:replace="~{layout :: header}"></header>

<main class="container-fluid px-4 py-4">
    <section class="workops-page-title mb-4">
        <p class="text-secondary mb-1">Asset Management</p>
        <h1 class="h3 mb-2">資産ステータス変更</h1>
        <p class="text-secondary mb-0">資産の現在ステータスを変更します。</p>
    </section>

    <section class="card">
        <div class="card-body">
            <div class="mb-4">
                <span class="badge text-bg-secondary" th:text="${asset.statusName()}">現在ステータス</span>
            </div>

            <dl class="row">
                <dt class="col-sm-3 text-secondary">資産コード</dt>
                <dd class="col-sm-9" th:text="${asset.code()}">KTHM-NB-001</dd>

                <dt class="col-sm-3 text-secondary">資産名</dt>
                <dd class="col-sm-9" th:text="${asset.name()}">営業部ノートPC</dd>

                <dt class="col-sm-3 text-secondary">現在ステータス</dt>
                <dd class="col-sm-9">
                    <span th:text="${asset.statusName()}">利用可能</span>
                    <span class="text-secondary" th:text="'(' + ${asset.statusCode()} + ')'">(AVAILABLE)</span>
                </dd>
            </dl>

            <form method="post" th:action="@{/assets/{id}/status(id=${asset.id()})}" th:object="${assetStatusForm}">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-4">
                    <label for="statusCode" class="form-label">変更後ステータス</label>
                    <select id="statusCode"
                            class="form-select"
                            th:field="*{statusCode}"
                            th:classappend="${#fields.hasErrors('statusCode')} ? ' is-invalid'">
                        <option value="">選択してください</option>
                        <option th:each="option : ${statusOptions}"
                                th:value="${option.code()}"
                                th:text="${option.name()}">利用可能</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('statusCode')}" th:errors="*{statusCode}">
                        資産ステータスを選択してください。
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">変更</button>
                    <a class="btn btn-outline-secondary" th:href="@{/assets/{id}(id=${asset.id()})}">キャンセル</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>
</body>
</html>
