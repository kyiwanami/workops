services:
  workops-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: workops
      MYSQL_USER: workops
      MYSQL_PASSWORD: workops
      MYSQL_ROOT_PASSWORD: workops_root
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "3306:3306"
    volumes:
      - workops_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migration:
    profiles:
      - migration
    image: redgate/flyway:12.9.0
    working_dir: /workops
    entrypoint:
      - /bin/sh
      - -c
    command:
      - >
        export FLYWAY_URL="$${WORKOPS_DB_URL}"
        && export FLYWAY_USER="$${WORKOPS_DB_USERNAME}"
        && export FLYWAY_PASSWORD="$${WORKOPS_DB_PASSWORD}"
        && export FLYWAY_LOCATIONS="$${WORKOPS_FLYWAY_LOCATIONS}"
        && /flyway/flyway migrate
    volumes:
      - .:/workops
    depends_on:
      workops-mysql:
        condition: service_healthy
    environment:
      WORKOPS_DB_URL: jdbc:mysql://workops-mysql:3306/workops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
      WORKOPS_DB_USERNAME: workops
      WORKOPS_DB_PASSWORD: workops
      WORKOPS_FLYWAY_LOCATIONS: filesystem:db/migration,filesystem:db/seed/common,filesystem:db/seed/local

volumes:
  workops_mysql_data:
