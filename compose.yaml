services:
  workops-mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: workops
      MYSQL_USER: workops
      MYSQL_PASSWORD: workops
      MYSQL_ROOT_PASSWORD: workops_root
      TZ: Asia/Tokyo
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    ports:
      - "3306:3306"
    volumes:
      - workops_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migration:
    profiles:
      - migration
    build:
      context: .
      dockerfile: infra/docker/migration/Dockerfile
    depends_on:
      workops-mysql:
        condition: service_healthy
    environment:
      WORKOPS_DB_URL: jdbc:mysql://workops-mysql:3306/workops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
      WORKOPS_DB_USERNAME: workops
      WORKOPS_DB_PASSWORD: workops
      WORKOPS_FLYWAY_LOCATIONS: filesystem:/flyway/sql/migration,filesystem:/flyway/sql/seed/common,filesystem:/flyway/sql/seed/local

volumes:
  workops_mysql_data:
